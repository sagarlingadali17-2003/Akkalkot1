<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        
        <!-- Original QGIS2Web CSS Imports -->
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        
        <!-- Google Fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
        
        <style>
            :root {
                --bg-dark: #0f172a;
                --bg-glass: rgba(15, 23, 42, 0.7);
                --border-glass: rgba(255, 255, 255, 0.1);
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --accent: #3b82f6;
            }

            * { box-sizing: border-box; font-family: 'Inter', sans-serif; }

            body, html {
                margin: 0; padding: 0;
                width: 100%; height: 100vh;
                background-color: var(--bg-dark);
                color: var(--text-main);
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }

            /* --- Header --- */
            header {
                height: 60px;
                background: var(--bg-glass);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border-bottom: 1px solid var(--border-glass);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 24px;
                z-index: 1000;
            }
            .brand { display: flex; align-items: center; gap: 12px; font-size: 1.2rem; font-weight: 700; }
            .brand i { color: var(--accent); }
            .badge {
                background: rgba(255,255,255,0.05);
                border: 1px solid var(--border-glass);
                padding: 6px 12px;
                border-radius: 20px;
                font-size: 0.85rem;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .badge i { color: #10b981; }

            /* --- Main Layout --- */
            #main-container {
                display: flex;
                flex: 1;
                height: calc(100vh - 60px);
            }

            /* --- Sidebar --- */
            #sidebar {
                width: 320px;
                background: var(--bg-glass);
                backdrop-filter: blur(12px);
                border-right: 1px solid var(--border-glass);
                display: flex;
                flex-direction: column;
                z-index: 999;
                overflow-y: auto;
            }
            .sidebar-header {
                padding: 20px;
                font-weight: 600;
                border-bottom: 1px solid var(--border-glass);
            }
            .layer-group { margin: 15px 0 5px 0; }
            .group-title {
                font-size: 0.75rem; text-transform: uppercase;
                color: var(--text-muted);
                padding: 0 20px; margin-bottom: 10px; font-weight: 700;
            }
            .layer-item {
                padding: 12px 20px;
                display: flex; flex-direction: column; gap: 10px;
                border-bottom: 1px solid rgba(255,255,255,0.02);
            }
            .layer-header { display: flex; justify-content: space-between; align-items: center; }
            .layer-name { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
            
            /* Custom Toggle Switch */
            .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
            .switch input { opacity: 0; width: 0; height: 0; }
            .slider {
                position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
                background-color: rgba(255,255,255,0.2); transition: .4s; border-radius: 34px;
            }
            .slider:before {
                position: absolute; content: ""; height: 14px; width: 14px;
                left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%;
            }
            input:checked + .slider { background-color: var(--accent); }
            input:checked + .slider:before { transform: translateX(16px); }

            /* Opacity Slider */
            .opacity-slider { width: 100%; appearance: none; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2); outline: none; }
            .opacity-slider::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); cursor: pointer; }

            /* --- Map Area --- */
            #map-wrapper { flex: 1; position: relative; }
            #map { width: 100%; height: 100%; background: #000; } 

            /* --- Modern Attribute Inspector Cards (Popup Override) --- */
            .leaflet-popup-content-wrapper {
                background: rgba(15, 23, 42, 0.9) !important;
                border: 1px solid var(--border-glass);
                color: var(--text-main);
                border-radius: 8px;
            }
            .leaflet-popup-tip { background: rgba(15, 23, 42, 0.9) !important; }
            .leaflet-popup-content table { width: 100%; border-collapse: collapse; }
            .leaflet-popup-content td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.85rem; }
            .leaflet-popup-content td:first-child { font-weight: 600; color: var(--text-muted); width: 40%; }
            .leaflet-container a.leaflet-popup-close-button { color: var(--text-muted); }
        </style>
        <title>Web-GIS Dashboard</title>
    </head>
    <body>
        
        <header>
            <div class="brand"><i class="fas fa-globe-asia"></i> Web-GIS Dashboard</div>
            <div class="badge"><i class="fas fa-satellite-dish"></i> Live Connection</div>
        </header>

        <div id="main-container">
            <aside id="sidebar">
                <div class="sidebar-header"><i class="fas fa-sliders-h"></i> Layers Control</div>
                <div id="layer-controls"></div>
            </aside>
            <div id="map-wrapper">
                <div id="map"></div>
            </div>
        </div>

        <!-- Scripts -->
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        
        <!-- Data Sources -->
        <script src="data/adminareas_2.js"></script>
        <script src="data/Clip_3.js"></script>
        <script src="data/landuse_4.js"></script>
        <script src="data/pois_5.js"></script>
        <script src="data/railways_6.js"></script>
        <script src="data/roads_7.js"></script>
        <script src="data/traffica_8.js"></script>
        <script src="data/traffic_9.js"></script>
        <script src="data/transporta_10.js"></script>
        <script src="data/transport_11.js"></script>
        <script src="data/Water_12.js"></script>
        <script src="data/waterways_13.js"></script>

        <script>
        var map = L.map('map', { zoomControl: true, maxZoom: 28, minZoom: 1 }).fitBounds([[17.1982,76.0529],[17.5649,76.4769]]);
        map.zoomControl.setPosition('bottomright');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

        function generatePopup(feature, props) {
            let rows = props.map(p => `<tr><td>${p}</td><td>${feature.properties[p] !== null ? autolinker.link(String(feature.properties[p])) : ''}</td></tr>`).join('');
            return `<table>${rows}</table>`;
        }

        var bounds_group = new L.featureGroup([]);

        // Basemaps
        map.createPane('pane_GoogleTerrain_0'); map.getPane('pane_GoogleTerrain_0').style.zIndex = 200;
        var layer_GoogleTerrain_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', {pane: 'pane_GoogleTerrain_0', maxZoom: 28});
        
        map.createPane('pane_GoogleSatellite_1'); map.getPane('pane_GoogleSatellite_1').style.zIndex = 201;
        var layer_GoogleSatellite_1 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {pane: 'pane_GoogleSatellite_1', maxZoom: 28});
        map.addLayer(layer_GoogleSatellite_1);

        // Layers
        map.createPane('pane_adminareas_2'); map.getPane('pane_adminareas_2').style.zIndex = 402;
        var layer_adminareas_2 = new L.geoJson(json_adminareas_2, {pane: 'pane_adminareas_2', style: { color: '#fff', weight: 1.5, fill: false }, onEachFeature: (f, l) => l.bindPopup(generatePopup(f, ['name', 'fclass']))}); map.addLayer(layer_adminareas_2);

        map.createPane('pane_Clip_3'); map.getPane('pane_Clip_3').style.zIndex = 403;
        var layer_Clip_3 = new L.geoJson(json_Clip_3, {pane: 'pane_Clip_3', style: { color: '#85b66f', weight: 2, fillOpacity: 0.1 }, onEachFeature: (f, l) => l.bindPopup(generatePopup(f, ['DISTRICT', 'SUB_DIST']))}); map.addLayer(layer_Clip_3);

        map.createPane('pane_landuse_4'); map.getPane('pane_landuse_4').style.zIndex = 404;
        var layer_landuse_4 = new L.geoJson(json_landuse_4, {pane: 'pane_landuse_4', style: { color: '#beb297', weight: 0.5 }, onEachFeature: (f, l) => l.bindPopup(generatePopup(f, ['name', 'fclass']))});

        map.createPane('pane_pois_5'); map.getPane('pane_pois_5').style.zIndex = 405;
        var layer_pois_5 = new L.geoJson(json_pois_5, {pane: 'pane_pois_5', pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 5, color: '#e5b636' }), onEachFeature: (f, l) => l.bindPopup(generatePopup(f, ['name']))}); map.addLayer(layer_pois_5);

        map.createPane('pane_railways_6'); map.getPane('pane_railways_6').style.zIndex = 406;
        var layer_railways_6 = new L.geoJson(json_railways_6, {pane: 'pane_railways_6', style: { color: '#ff4757', weight: 2, dashArray: '4,4' }, onEachFeature: (f, l) => l.bindPopup(generatePopup(f, ['name']))}); map.addLayer(layer_railways_6);

        map.createPane('pane_roads_7'); map.getPane('pane_roads_7').style.zIndex = 407;
        var layer_roads_7 = new L.geoJson(json_roads_7, {pane: 'pane_roads_7', style: { color: '#e77148', weight: 1.5 }, onEachFeature: (f, l) => l.bindPopup(generatePopup(f, ['name', 'fclass']))}); map.addLayer(layer_roads_7);

        map.createPane('pane_traffica_8'); map.getPane('pane_traffica_8').style.zIndex = 408;
        var layer_traffica_8 = new L.geoJson(json_traffica_8, {pane: 'pane_traffica_8', style: { color: '#ff9e17' }, onEachFeature: (f, l) => l.bindPopup(generatePopup(f, ['name']))});

        map.createPane('pane_traffic_9'); map.getPane('pane_traffic_9').style.zIndex = 409;
        var layer_traffic_9 = new L.geoJson(json_traffic_9, {pane: 'pane_traffic_9', pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 4, color: '#8d5a99' })});

        map.createPane('pane_transporta_10'); map.getPane('pane_transporta_10').style.zIndex = 410;
        var layer_transporta_10 = new L.geoJson(json_transporta_10, {pane: 'pane_transporta_10', style: { color: '#729b6f' }});

        map.createPane('pane_transport_11'); map.getPane('pane_transport_11').style.zIndex = 411;
        var layer_transport_11 = new L.geoJson(json_transport_11, {pane: 'pane_transport_11', pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 4, color: '#a47158' })});

        map.createPane('pane_Water_12'); map.getPane('pane_Water_12').style.zIndex = 412;
        var layer_Water_12 = new L.geoJson(json_Water_12, {pane: 'pane_Water_12', style: { color: '#3b82f6', weight: 1 }, onEachFeature: (f, l) => l.bindPopup(generatePopup(f, ['name']))}); map.addLayer(layer_Water_12);

        map.createPane('pane_waterways_13'); map.getPane('pane_waterways_13').style.zIndex = 413;
        var layer_waterways_13 = new L.geoJson(json_waterways_13, {pane: 'pane_waterways_13', style: { color: '#60a5fa', weight: 2 }, onEachFeature: (f, l) => l.bindPopup(generatePopup(f, ['name']))}); map.addLayer(layer_waterways_13);

        // Sidebar Generator
        const layersList = [
            { name: "Google Satellite", layer: layer_GoogleSatellite_1, pane: "pane_GoogleSatellite_1", active: true },
            { name: "Google Terrain", layer: layer_GoogleTerrain_0, pane: "pane_GoogleTerrain_0", active: false },
            { name: "Admin Areas", layer: layer_adminareas_2, pane: "pane_adminareas_2", active: true },
            { name: "Region Boundary", layer: layer_Clip_3, pane: "pane_Clip_3", active: true },
            { name: "Roads", layer: layer_roads_7, pane: "pane_roads_7", active: true },
            { name: "Railways", layer: layer_railways_6, pane: "pane_railways_6", active: true },
            { name: "Water Bodies", layer: layer_Water_12, pane: "pane_Water_12", active: true },
            { name: "Waterways", layer: layer_waterways_13, pane: "pane_waterways_13", active: true },
            { name: "Landuse", layer: layer_landuse_4, pane: "pane_landuse_4", active: false },
            { name: "POIs", layer: layer_pois_5, pane: "pane_pois_5", active: true },
            { name: "Traffic Areas", layer: layer_traffica_8, pane: "pane_traffica_8", active: false },
            { name: "Traffic Points", layer: layer_traffic_9, pane: "pane_traffic_9", active: false },
            { name: "Transport Areas", layer: layer_transporta_10, pane: "pane_transporta_10", active: false },
            { name: "Transport Points", layer: layer_transport_11, pane: "pane_transport_11", active: false }
        ];

        const panel = document.getElementById('layer-controls');
        layersList.forEach((item, idx) => {
            panel.insertAdjacentHTML('beforeend', `
            <div class="layer-item">
                <div class="layer-header">
                    <span class="layer-name">${item.name}</span>
                    <label class="switch">
                        <input type="checkbox" id="chk-${idx}" ${item.active ? 'checked' : ''}>
                        <span class="slider"></span>
                    </label>
                </div>
                <input type="range" class="opacity-slider" id="op-${idx}" min="0" max="1" step="0.05" value="1">
            </div>`);

            document.getElementById(`chk-${idx}`).addEventListener('change', (e) => {
                e.target.checked ? map.addLayer(item.layer) : map.removeLayer(item.layer);
            });
            document.getElementById(`op-${idx}`).addEventListener('input', (e) => {
                let p = map.getPane(item.pane); if(p) p.style.opacity = e.target.value;
            });
        });
        </script>
    </body>
</html>
